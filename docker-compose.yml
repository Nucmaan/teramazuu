services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scim
      POSTGRES_PASSWORD: scim_dev_password
      POSTGRES_DB: scim2026
    ports:
      - "5433:5432"
    volumes:
      - scim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scim -d scim2026"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  scim_pgdata:
